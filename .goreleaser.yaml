version: 2
project_name: fiken-cli

changelog:
  disable: true

builds:
  - id: fiken-cli
    main: ./cmd/fiken-cli
    binary: fiken-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X fiken-cli/internal/cli.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: fiken-mcp
    main: ./cmd/fiken-mcp
    binary: fiken-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - skills/**

checksum:
  name_template: checksums.txt
